name: build
on:
  push:
  workflow_dispatch:

# Everything is built and typechecked on GitHub's machines. Nothing needs a
# local toolchain — that is the point.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: malam-slice-${{ github.sha }}
          path: dist
